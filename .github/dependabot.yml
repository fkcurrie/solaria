version: 2
updates:
  # Maintain Go dependencies in go.mod
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "automated pr"
    commit-message:
      prefix: "chore(deps):"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "actions"
      - "dependencies"
      - "automated pr"
    commit-message:
      prefix: "chore(ci):"
