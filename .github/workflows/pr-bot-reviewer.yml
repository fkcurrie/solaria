name: "PR Quality & Security Bot Reviewer"

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  bot-pr-review:
    name: "Automated Bot Code Review & Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Security Vulnerability Scan (govulncheck)
        id: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if govulncheck ./... > govuln_output.txt 2>&1; then
            echo "VULN_STATUS=PASSED" >> $GITHUB_ENV
          else
            echo "VULN_STATUS=WARNINGS_FOUND" >> $GITHUB_ENV
          fi
          cat govuln_output.txt

      - name: Go Security AST Scan (gosec)
        id: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          if gosec -quiet -exclude=G104 ./... > gosec_output.txt 2>&1; then
            echo "GOSEC_STATUS=PASSED" >> $GITHUB_ENV
          else
            echo "GOSEC_STATUS=WARNINGS_FOUND" >> $GITHUB_ENV
          fi
          cat gosec_output.txt

      - name: Format & Syntax Check (gofmt)
        id: gofmt
        run: |
          FMT_OUT=$(gofmt -l .)
          if [ -z "$FMT_OUT" ]; then
            echo "FMT_STATUS=PASSED" >> $GITHUB_ENV
          else
            echo "FMT_STATUS=FORMATTING_REQUIRED" >> $GITHUB_ENV
          fi

      - name: Run Package Unit Tests
        id: test
        run: |
          if go test -v ./... > test_output.txt 2>&1; then
            echo "TEST_STATUS=PASSED" >> $GITHUB_ENV
          else
            echo "TEST_STATUS=FAILED" >> $GITHUB_ENV
          fi

      - name: Post Automated PR Bot Review Comment
        uses: actions/github-script@v9
        with:
          script: |
            const vulnStatus = process.env.VULN_STATUS || 'UNKNOWN';
            const gosecStatus = process.env.GOSEC_STATUS || 'UNKNOWN';
            const fmtStatus = process.env.FMT_STATUS || 'UNKNOWN';
            const testStatus = process.env.TEST_STATUS || 'UNKNOWN';

            const isClean = vulnStatus === 'PASSED' && gosecStatus === 'PASSED' && fmtStatus === 'PASSED' && testStatus === 'PASSED';

            const commentBody = `### 🤖 Solaria Bot Code Quality & Security Audit Report

            | Audit Domain | Status | Tool |
            | :--- | :--- | :--- |
            | **Vulnerability Check** | ${vulnStatus === 'PASSED' ? '✅ PASSED' : '⚠️ WARNINGS'} | \`govulncheck\` |
            | **AST Security Analysis** | ${gosecStatus === 'PASSED' ? '✅ PASSED' : '⚠️ WARNINGS'} | \`gosec\` |
            | **Formatting & Syntax** | ${fmtStatus === 'PASSED' ? '✅ PASSED' : '🎨 FORMATTING NEEDED'} | \`gofmt\` |
            | **Unit Test Suite** | ${testStatus === 'PASSED' ? '✅ PASSED' : '❌ FAILED'} | \`go test\` |

            ---

            ${isClean ? '**Verdict:** 🟢 **READY FOR MERGE.** All automated quality, linter, and security checks passed cleanly.' : '**Verdict:** 🟡 **REVIEW NEEDED.** Please resolve flagged items before merging.'}

            *Automated audit by Solaria Bot Quality Engine.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

            if (isClean) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['quality-pass', 'security-pass']
              });
            }
