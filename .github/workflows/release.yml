name: "Solaria Production 6-Gate Release Engine"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  security-events: write

jobs:
  release-gatekeeper:
    name: "Automated 6-Gate Release Protocol & Asset Bundler"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract Release Variables
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "COMMIT=${COMMIT}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Gate 1: Code Linting & Static Security Analysis
      # ------------------------------------------------------------------------
      - name: "Gate 1: Code Linting (golangci-lint)"
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m

      # ------------------------------------------------------------------------
      # Gate 2: Package Unit Test Suite
      # ------------------------------------------------------------------------
      - name: "Gate 2: Package Unit Tests"
        run: go test -v ./...

      # ------------------------------------------------------------------------
      # Gate 3: 31-Probe E2E System Audit
      # ------------------------------------------------------------------------
      - name: "Gate 3: 31-Probe E2E System Audit"
        run: |
          mkdir -p bin
          echo "Compiling Solaria binaries for E2E audit..."
          go build -o bin/solaria-bridge ./cmd/bridge
          go build -o bin/solaria-cloud ./cmd/cloud-server
          go build -o bin/solaria-e2e-audit ./cmd/e2e-audit

          echo "Launching test daemons in background..."
          SOLARIA_MOCK_MODBUS=true ./bin/solaria-bridge > bridge_test.log 2>&1 &
          BRIDGE_PID=$!

          CLOUD_HTTP_PORT=8081 ./bin/solaria-cloud > cloud_test.log 2>&1 &
          CLOUD_PID=$!

          sleep 3

          echo "Executing 31-Probe E2E Audit..."
          if ./bin/solaria-e2e-audit; then
            echo "E2E Audit PASSED 100%"
          else
            echo "E2E Audit FAILED! Logs:"
            cat bridge_test.log
            cat cloud_test.log
            kill $BRIDGE_PID $CLOUD_PID || true
            exit 1
          fi

          kill $BRIDGE_PID $CLOUD_PID || true

      # ------------------------------------------------------------------------
      # Gate 4: Vulnerability Database Scan
      # ------------------------------------------------------------------------
      - name: "Gate 4: Vulnerability Scan (govulncheck)"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # ------------------------------------------------------------------------
      # Gate 5: Documentation Alignment & Release Notes Check
      # ------------------------------------------------------------------------
      - name: "Gate 5: Documentation Verification"
        run: |
          NOTES_FILE="RELEASE_NOTES/${{ steps.vars.outputs.VERSION }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Found matching release notes: $NOTES_FILE"
          else
            echo "RELEASE NOTES MISSING: Expected $NOTES_FILE"
            exit 1
          fi

      # ------------------------------------------------------------------------
      # Gate 6: Cross-Compilation, Tarball/Zip Asset Packaging & SHA256SUMS
      # ------------------------------------------------------------------------
      - name: "Gate 6: Multi-Arch Asset Packaging"
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${{ steps.vars.outputs.VERSION }} -X main.Commit=${{ steps.vars.outputs.COMMIT }} -X main.BuildDate=${{ steps.vars.outputs.BUILD_DATE }}"

          # Target Architectures: amd64, arm64, arm (v7)
          for ARCH in amd64 arm64 arm; do
            echo "==> Packaging Solaria bundle for linux/${ARCH}..."
            BUNDLE_DIR="solaria_${{ steps.vars.outputs.VERSION }}_linux_${ARCH}"
            mkdir -p "${BUNDLE_DIR}/bin"
            mkdir -p "${BUNDLE_DIR}/systemd"

            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUNDLE_DIR}/bin/solaria-bridge" ./cmd/bridge
            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUNDLE_DIR}/bin/solaria-edge" ./cmd/edge-agent
            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUNDLE_DIR}/bin/solaria-cloud" ./cmd/cloud-server
            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUNDLE_DIR}/bin/solaria-e2e-audit" ./cmd/e2e-audit

            cp systemd/*.service "${BUNDLE_DIR}/systemd/"
            cp .env.example "${BUNDLE_DIR}/.env.example"
            cp install.sh "${BUNDLE_DIR}/install.sh"
            cp setup.sh "${BUNDLE_DIR}/setup.sh"

            TARBALL="dist/solaria_${{ steps.vars.outputs.VERSION }}_linux_${ARCH}.tar.gz"
            ZIPFILE="dist/solaria_${{ steps.vars.outputs.VERSION }}_linux_${ARCH}.zip"

            tar -czvf "${TARBALL}" "${BUNDLE_DIR}"
            zip -r "${ZIPFILE}" "${BUNDLE_DIR}"

            rm -rf "${BUNDLE_DIR}"
          done

          cd dist
          sha256sum solaria_* > SHA256SUMS
          cat SHA256SUMS

      # ------------------------------------------------------------------------
      # Publish Draft Release on GitHub
      # ------------------------------------------------------------------------
      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Solaria Release ${{ steps.vars.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          body_path: "RELEASE_NOTES/${{ steps.vars.outputs.VERSION }}.md"
          files: |
            dist/solaria_*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
