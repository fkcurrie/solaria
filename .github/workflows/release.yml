name: "Solaria Production Release Engine"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: "Build Cross-Platform Binaries & GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Extract Release Version
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "COMMIT=${COMMIT}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Cross-Compile & Package Binary Bundles
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${{ steps.vars.outputs.VERSION }} -X main.Commit=${{ steps.vars.outputs.COMMIT }} -X main.BuildDate=${{ steps.vars.outputs.BUILD_DATE }}"

          # Architectures: amd64, arm64, arm (ARMv7)
          for ARCH in amd64 arm64 arm; do
            echo "==> Building Solaria release binaries for linux/${ARCH}..."
            BUILD_DIR="build_linux_${ARCH}"
            mkdir -p "${BUILD_DIR}"

            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/solaria-bridge" ./cmd/bridge
            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/solaria-edge" ./cmd/edge-agent
            GOOS=linux GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/solaria-cloud" ./cmd/cloud-server

            TARBALL="dist/solaria_${{ steps.vars.outputs.VERSION }}_linux_${ARCH}.tar.gz"
            tar -czvf "${TARBALL}" -C "${BUILD_DIR}" solaria-bridge solaria-edge solaria-cloud
          done

          cd dist
          sha256sum solaria_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Solaria Release ${{ steps.vars.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/solaria_*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
