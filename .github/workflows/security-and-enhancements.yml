name: Security Vulnerability Scan and Automated Maintenance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    name: Security and Vulnerability Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Run Go Vulnerability Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Go Security AST Scanner (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 -fmt=sarif -out=gosec.sarif ./... || true

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  auto-enhance:
    name: Code Formatting and Maintenance PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Run Auto-Formatters and Dependency Tidy
        run: |
          gofmt -s -w .
          go mod tidy

      - name: Create Pull Request with Maintenance Fixes
        uses: peter-evans/create-pull-request@v8
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(automated): Apply Go formatting, tidy, and security fixes"
          committer: "GitHub Action <actions@github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "automated-enhancements-patch"
          delete-branch: true
          title: "Automated Code Formatting and Maintenance"
          body: |
            ### Automated Code Maintenance Patch
            
            This Pull Request was automatically generated by GitHub Actions:
            
            - **`gofmt -s -w .`**: Applied standardized Go code formatting and simplifications.
            - **`go mod tidy`**: Cleaned and reconciled dependencies in `go.mod` and `go.sum`.
            - **Security & Integrity**: Verified against `govulncheck` vulnerability database.
            
            *Triggered automatically by the Solaria CI pipeline.*
          labels: |
            enhancement
            automated pr
