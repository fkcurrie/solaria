name: 🛡️ Security Vulnerability Scan & Auto-Fix PRs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    name: 🔒 Security & Vulnerability Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 🛡️ Run Official Go Vulnerability Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: 🔍 Run Go Security AST Scanner (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 -fmt=sarif -out=gosec.sarif ./... || true

      - name: 📊 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  auto-enhance:
    name: 🪄 Code Enhancements & Auto-Fix PR
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 🧹 Run Auto-Formatters & Dependency Tidy
        run: |
          gofmt -s -w .
          go mod tidy

      - name: 🚀 Create Pull Request with Enhancements
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(automated): Apply Go formatting, tidy, and security fixes"
          committer: "GitHub Action <actions@github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "automated-enhancements-patch"
          delete-branch: true
          title: "🤖 Automated Code Enhancements & Security Fixes"
          body: |
            ### 🤖 Automated Code Enhancement & Security Patch
            
            This Pull Request was automatically generated by GitHub Actions:
            
            - **`gofmt -s -w .`**: Applied standardized Go code formatting and simplifications.
            - **`go mod tidy`**: Cleaned and reconciled dependencies in `go.mod` and `go.sum`.
            - **Security & Integrity**: Verified against `govulncheck` vulnerability database.
            
            *Triggered automatically by the Solaria CI pipeline.*
          labels: |
            enhancement
            automated pr
