name: "Solaria Multi-Distro & ARM Bootstrap CI"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # 1. Compile & Unit Test Go Codebase
  # --------------------------------------------------------------------------
  build-and-test:
    name: "Go Unit Tests & Multi-Arch Build"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, arm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests (amd64)
        if: matrix.goarch == 'amd64'
        run: go test -v ./...

      - name: Cross-Compile Solaria Binaries for ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -o bin/solaria-bridge ./cmd/bridge/main.go
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -o bin/solaria-cloud-server ./cmd/cloud-server/main.go
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -o bin/solaria-sre-agent ./cmd/sre-agent/main.go
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -o bin/solaria-e2e-audit ./cmd/e2e-audit/main.go

  # --------------------------------------------------------------------------
  # 2. Multi-Distro Bootstrap Regression Matrix (Debian, Ubuntu, Raspberry Pi)
  # --------------------------------------------------------------------------
  test-installer-matrix:
    name: "Bootstrap Test: ${{ matrix.distro }} (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Raspberry Pi OS / Debian Bookworm on ARM64 (Emulated RPi)
          - distro: "debian:bookworm-slim"
            arch: "arm64"
            target_os: "Raspberry Pi OS (ARM64)"
          # 2. Debian 12 Minimal on x86_64
          - distro: "debian:bookworm-slim"
            arch: "amd64"
            target_os: "Debian 12 Bookworm (x86_64)"
          # 3. Ubuntu Server 24.04 LTS on x86_64
          - distro: "ubuntu:24.04"
            arch: "amd64"
            target_os: "Ubuntu 24.04 LTS (x86_64)"

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for ARM emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Run 1-Click Installer inside ${{ matrix.target_os }} Container
        run: |
          docker run --rm --privileged \
            --platform linux/${{ matrix.arch }} \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ matrix.distro }} bash -c '
              set -e
              apt-get update -qq && apt-get install -y -qq sudo curl systemd util-linux
              
              # Execute installer
              bash deploy/install.sh
              
              # Assertions: Verify power-loss hardening and systemd service creation
              echo "==> Verifying Volatile Journaling Configuration..."
              test -f /etc/systemd/journald.conf.d/solaria-volatile.conf
              grep -q "Storage=volatile" /etc/systemd/journald.conf.d/solaria-volatile.conf
              
              echo "==> Verifying Hardware Watchdog Configuration..."
              test -f /etc/systemd/system.conf.d/solaria-watchdog.conf
              grep -q "RuntimeWatchdogSec=15s" /etc/systemd/system.conf.d/solaria-watchdog.conf
              
              echo "==> Verifying Kernel Panic Auto-Reboot Sysctl..."
              test -f /etc/sysctl.d/99-solaria-resilience.conf
              grep -q "kernel.panic = 10" /etc/sysctl.d/99-solaria-resilience.conf
              
              echo "==> Verifying Systemd Service Unit Installation..."
              test -f /etc/systemd/system/solaria-bridge.service
              test -f /etc/systemd/system/solaria-sre.service
              test -f /etc/solaria/solaria.env
              
              echo "✅ Installer verified successfully on ${{ matrix.target_os }}!"
            '
