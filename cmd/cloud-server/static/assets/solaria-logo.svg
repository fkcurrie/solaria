<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="sunDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <!-- Sun Right Hemisphere Soft Shadow -->
    <linearGradient id="sunDiscDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Energy Bolt Gradient -->
    <linearGradient id="boltCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Clean Minimal Icon Mark (Center: 50, 50, Radius: 36) -->
  <g transform="translate(10, 0)">
    <!-- Base Sun Disc Left Half -->
    <path d="M 50,14 A 36,36 0 0,0 50,86 Z" fill="url(#sunDisc)" />
    <!-- Base Sun Disc Right Half -->
    <path d="M 50,14 A 36,36 0 0,1 50,86 Z" fill="url(#sunDiscDark)" />

    <!-- Bold Cyan Energy Bolt / 'S' Slash with dark silhouette outline -->
    <!-- Point top: (62, 2), inner elbow: (38, 48), step right: (58, 48), bottom tip: (38, 98), lower inner: (62, 52), step left: (42, 52) -->
    <polygon points="63,2 35,50 49,50 37,98 65,50 51,50" 
             fill="#0b0f19" stroke="#0b0f19" stroke-width="6" stroke-linejoin="round" />
    <polygon points="63,2 35,50 49,50 37,98 65,50 51,50" 
             fill="url(#boltCyan)" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 0)">
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="40" font-weight="800" letter-spacing="3" fill="#f8fafc">
      SOLARIA
    </text>
    <text x="2" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="11" font-weight="600" letter-spacing="2" fill="#38bdf8" text-transform="uppercase">
      Solar Intelligence Platform
    </text>
  </g>
</svg>
