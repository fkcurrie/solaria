<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (x: 10..110, y: 10..110, center: 60, 60) -->
  <g transform="translate(10, 10)">
    <!-- Outer Solar Radar Grid -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 3" />
    <circle cx="50" cy="50" r="38" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Grid Crosshairs -->
    <line x1="50" y1="4" x2="50" y2="96" stroke="#0284c7" stroke-width="1" stroke-opacity="0.35" />
    <line x1="4" y1="50" x2="96" y2="50" stroke="#0284c7" stroke-width="1" stroke-opacity="0.35" />
    
    <!-- Geometric Sun Rays (8-point star) -->
    <!-- Point 0/180/90/270 and diagonals -->
    <polygon points="50,14 55,36 78,22 64,45 86,50 64,55 78,78 55,64 50,86 45,64 22,78 36,55 14,50 36,45 22,22 45,36" 
             fill="none" stroke="url(#sunGrad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <polygon points="50,22 53,38 69,31 60,46 76,50 60,54 69,69 53,62 50,78 47,62 31,69 40,54 24,50 40,46 31,31 47,38" 
             fill="#f59e0b" fill-opacity="0.2" stroke="url(#sunGrad)" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Center Core -->
    <circle cx="50" cy="50" r="15" fill="#0b0f19" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Power Lightning Bolt -->
    <polygon points="53,26 42,48 51,48 45,74 59,50 49,50" 
             fill="url(#boltGrad)" stroke="#ffffff" stroke-width="0.75" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <!-- SOLARIA Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" font-weight="900" letter-spacing="4" fill="#f8fafc">
      SOLARIA
    </text>
    
    <!-- Glow/Accent on 'IA' or subtitle -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#38bdf8" text-transform="uppercase">
      Solar Energy Intelligence &amp; Cloud Analytics
    </text>
    
    <!-- Accent Line -->
    <rect x="0" y="88" width="220" height="2.5" rx="1.25" fill="url(#sunGrad)" />
    <rect x="225" y="88" width="60" height="2.5" rx="1.25" fill="url(#boltGrad)" />
  </g>
</svg>
